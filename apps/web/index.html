<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Chess</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Apex Chess needs JavaScript. Please turn it on and reload.</noscript>
    <script>
      addEventListener(
        "error",
        function (e) {
          var root = document.getElementById("root");
          if (root && !root.hasChildNodes() && e.target !== window)
            root.textContent = "Apex Chess failed to load. Please reload the page.";
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
