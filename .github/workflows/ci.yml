name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON, YAML, and shell syntax
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check --user --break-system-packages pyyaml
          status=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; status=1; }
          done < <(git ls-files -z '*.json')
          while IFS= read -r -d '' f; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f" || { echo "::error file=$f::invalid YAML"; status=1; }
          done < <(git ls-files -z '*.yml' '*.yaml')
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::shell syntax error"; status=1; }
          done < <(git ls-files -z '*.sh')
          exit $status

      - name: Detect the pnpm workspace
        id: ws
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet: skipping the pnpm checks."; fi

      - if: steps.ws.outputs.node == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.ws.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.ws.outputs.node == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.ws.outputs.node == 'true'
        run: pnpm typecheck
      - if: steps.ws.outputs.node == 'true'
        run: pnpm lint
      - if: steps.ws.outputs.node == 'true'
        run: pnpm test
      - if: steps.ws.outputs.node == 'true'
        run: pnpm validate:rules
