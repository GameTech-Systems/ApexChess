title: "[Playtest] "
labels: ["playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Posting here means your feedback is a Contribution under the Apex Chess CLA (see CLA.md).
  - type: input
    id: ruleset
    attributes:
      label: Ruleset id and version
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What did you notice?
      description: Did either side feel favored? Which moments felt unclear?
    validations:
      required: true
